<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Azadi Connect</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar" dir="ltr">
    <div class="title-brand"><span class="logo-mini">A</span><span>AZADI <b>CONNECT</b></span><span class="version">v0.1.0 · Preview</span></div>
    <div class="window-controls"><button id="win-min" aria-label="Minimize">−</button><button id="win-max" aria-label="Maximize">□</button><button id="win-close" aria-label="Close to tray">×</button></div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo-mark" data-icon="azadi"></div><div><strong data-i18n="brand">آزادی کانکت</strong><span data-i18n="brandSub">اینترنت، به انتخاب تو.</span></div></div>
      <div class="nav-label" data-i18n="workspace">فضای اتصال</div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard"><span data-icon="grid"></span><span data-i18n="dashboard"></span><span class="nav-dot"></span></button>
        <button class="nav-item" data-page="profiles"><span data-icon="layers"></span><span data-i18n="profiles"></span><span id="profile-count" class="count">۰</span></button>
        <button class="nav-item" data-page="apps"><span data-icon="apps"></span><span data-i18n="apps"></span></button>
        <button class="nav-item" data-page="settings"><span data-icon="settings"></span><span data-i18n="settings"></span></button>
      </nav>
      <div class="sidebar-bottom"><div class="local-badge"><span class="status-dot"></span><span data-i18n="localOnly"></span></div><p data-i18n="privacyShort"></p><button id="project-link" class="text-button"><span data-icon="code"></span><span data-i18n="openSource"></span><span>↗</span></button></div>
    </aside>
    <main>
      <div class="topline"><div><div class="eyebrow" data-i18n="eyebrow"></div><h1 id="page-title"></h1><p id="page-subtitle" class="muted"></p></div><div class="top-actions"><button id="language" class="pill" aria-label="Change language">EN <span>⇄</span></button><button id="theme" class="icon-button" data-icon="sun" aria-label="Change theme"></button><button class="button secondary import-trigger"><span data-icon="plus"></span><span data-i18n="import"></span></button></div></div>
      <div id="view-dashboard" class="view active">
        <section class="dashboard-grid">
          <article class="connection-card panel">
            <div class="card-top"><span class="section-label"><span data-icon="shield"></span><span data-i18n="connection"></span></span><span class="state-badge" id="state-badge"></span></div>
            <div class="orbital" id="orbital"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div><span class="orbit-spark spark-one"></span><span class="orbit-spark spark-two"></span><button id="power" class="power" aria-label="Connect"><span data-icon="power"></span></button></div>
            <h2 id="status-title"></h2><p id="status-caption" class="muted"></p>
            <button id="connect" class="button connect-button"><span data-icon="power"></span><span id="connect-label"></span></button>
            <div class="connection-bottom"><span class="tiny-dot"></span><span data-i18n="noAccount"></span><span>·</span><span data-i18n="yourServer"></span></div>
          </article>
          <div class="connection-options">
            <article class="panel profile-card"><div class="card-top"><span class="section-label"><span data-icon="globe"></span><span data-i18n="activeProfile"></span></span><span class="mini-label">01</span></div><label for="profile-select" class="sr-only" data-i18n="activeProfile"></label><select id="profile-select"></select><div id="profile-info" class="profile-info"></div><button class="text-button import-trigger"><span data-icon="upload"></span><span data-i18n="importHint"></span></button></article>
            <article class="panel routing-card"><div class="card-top"><span class="section-label"><span data-icon="route"></span><span data-i18n="routing"></span></span><span class="mini-label">02</span></div><button id="mode-apps" class="mode-option"><span class="mode-icon" data-icon="apps"></span><span><strong data-i18n="appsMode"></strong><small data-i18n="appsModeSub"></small></span><span class="radio"></span></button><button id="mode-system" class="mode-option"><span class="mode-icon" data-icon="monitor"></span><span><strong data-i18n="systemMode"></strong><small data-i18n="systemModeSub"></small></span><span class="radio"></span></button><p class="routing-note"><span data-icon="info"></span><span data-i18n="modeNote"></span></p></article>
          </div>
        </section>
        <section class="stats"><article class="stat"><span class="stat-icon teal" data-icon="arrowDown"></span><div><span class="muted" data-i18n="download"></span><strong id="download" dir="ltr">0 B</strong></div></article><article class="stat"><span class="stat-icon violet" data-icon="arrowUp"></span><div><span class="muted" data-i18n="upload"></span><strong id="upload" dir="ltr">0 B</strong></div></article><article class="stat"><span class="stat-icon amber" data-icon="pulse"></span><div><span class="muted" data-i18n="latency"></span><strong id="latency" dir="ltr">— ms</strong></div></article><article class="stat"><span class="stat-icon blue" data-icon="clock"></span><div><span class="muted" data-i18n="duration"></span><strong id="duration" dir="ltr">00:00:00</strong></div></article></section>
        <section class="panel quick-apps"><div class="card-top"><div><h3 data-i18n="selectedApps"></h3><p class="muted" data-i18n="selectedAppsSub"></p></div><button class="text-button" id="manage-apps"><span data-i18n="manageApps"></span><span>↗</span></button></div><div id="quick-app-list"></div></section>
      </div>
      <div id="view-profiles" class="view"><div class="panel list-panel"><div class="card-top"><h3 data-i18n="profiles"></h3><span class="protocol-pill">WireGuard · V2Ray · OpenVPN</span></div><div id="profiles-list"></div></div><div class="notice"><span data-icon="info"></span><p data-i18n="formatNotice"></p></div></div>
      <div id="view-apps" class="view"><div class="panel list-panel"><div class="card-top"><h3 data-i18n="selectedApps"></h3><div class="button-row"><button id="running-apps" class="button secondary"><span data-icon="refresh"></span><span data-i18n="runningApps"></span></button><button id="add-app" class="button"><span data-icon="plus"></span><span data-i18n="addApp"></span></button></div></div><div id="apps-list"></div></div><div class="notice"><span data-icon="info"></span><p data-i18n="appsNotice"></p></div><div id="running-list" class="panel list-panel hidden"></div></div>
      <div id="view-settings" class="view"><div class="panel list-panel settings-grid"><h3 data-i18n="settings"></h3><div class="setting-row"><div><strong data-i18n="language"></strong><p class="muted" data-i18n="languageSub"></p></div><div class="button-row"><button id="set-fa" class="button secondary">فارسی</button><button id="set-en" class="button secondary">English</button></div></div><div class="setting-row"><div><strong data-i18n="appearance"></strong><p class="muted" data-i18n="appearanceSub"></p></div><button id="set-theme" class="button secondary" data-i18n="toggleTheme"></button></div><div class="setting-row"><div><strong data-i18n="vault"></strong><p class="muted" data-i18n="vaultSub"></p></div><span class="protocol-pill" id="vault-state">DPAPI</span></div><div class="notice danger"><span data-icon="info"></span><p data-i18n="killNotice"></p></div><div class="notice"><span data-icon="globe"></span><p data-i18n="dnsNotice"></p></div><div class="about"><strong>Azadi Connect <span>0.1.0 · Preview</span></strong><p data-i18n="chatgpt"></p><p data-i18n="aboutCore"></p></div></div></div>
      <footer><div class="footer-status"><span class="tiny-dot"></span><span id="footer-status"></span><span class="footer-divider">/</span><span>sing-box 1.14.3</span></div><div class="for-iran"><span>برای ایران <b class="heart">♥</b></span><span class="footer-divider">|</span><span dir="ltr">For Iran <b class="heart">♥</b></span></div><span class="footer-credit">Made with ChatGPT</span></footer>
    </main>
  </div>
  <dialog id="import-dialog"><form id="import-form"><div class="modal-heading"><div><span class="eyebrow" data-i18n="addConnection"></span><h2 data-i18n="importTitle"></h2></div><button type="button" id="close-import" class="icon-button" aria-label="Close">×</button></div><p class="muted" data-i18n="importDescription"></p><button type="button" id="file-import" class="file-drop"><span data-icon="upload"></span><strong data-i18n="chooseFile"></strong><small>.conf · .ovpn · .txt</small></button><div class="divider" data-i18n="orPaste"></div><label for="profile-text" data-i18n="pasteLabel"></label><textarea id="profile-text" dir="ltr" spellcheck="false" placeholder="vless://…  ss://…  vmess://…"></textarea><details><summary data-i18n="ovpnCredentials"></summary><div class="credentials"><label><span data-i18n="username"></span><input id="vpn-username" autocomplete="off" dir="ltr"></label><label><span data-i18n="password"></span><input id="vpn-password" type="password" autocomplete="off" dir="ltr"></label></div></details><p class="form-note" data-i18n="importPrivacy"></p><button type="submit" class="button" id="paste-import"><span data-icon="plus"></span><span data-i18n="addProfiles"></span></button></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="i18n.js"></script><script src="icons.js"></script><script src="app.js"></script>
</body>
</html>
