name: Android APK
on:
  push:
    branches: [main, feature/android-native]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '3'
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.1.13356709
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install pinned Android SDK components
        run: android/scripts/install-sdk-linux.sh
      - name: Cache the pinned native library
        id: core-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: android/app/libs/libbox.aar
          key: libbox-android-v1.14.3-ndk28.1-go1.25.5-${{ hashFiles('android/scripts/build-core.sh', 'android/scripts/install-sdk-linux.sh') }}
      - name: Build pinned sing-box Android library
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: android/scripts/build-core.sh
      - name: Save the verified native library before device tests
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: android/app/libs/libbox.aar
          key: libbox-android-v1.14.3-ndk28.1-go1.25.5-${{ hashFiles('android/scripts/build-core.sh', 'android/scripts/install-sdk-linux.sh') }}
      - name: Build APK, test importers and run Android lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Stage test APK and checksums
        run: |
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android/Azadi-Connect-1.0.0-Android-debug.apk
          cd artifacts/android
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Azadi-Connect-Android-debug
          path: artifacts/android/*
          if-no-files-found: error
      - name: Enable isolated emulator hardware acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run Android 15 device tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '35'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-linux-hw-accel: 'false'
          working-directory: android
          script: bash scripts/device-tests.sh
      - name: Summarize actual Android device test results
        if: always()
        run: python3 android/scripts/report-device-tests.py
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Android-validation-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            artifacts/android-screenshots/
          if-no-files-found: ignore
